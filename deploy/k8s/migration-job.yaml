# One-shot data cutover: imports the phase-1 SQLite board into PostgreSQL.
# The old taskboard-data PVC is mounted read-only; the importer never writes to it.
# Run: kubectl -n <ns> create job --from=job/taskboard-migrate taskboard-migrate-1
apiVersion: batch/v1
kind: Job
metadata:
  name: taskboard-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - node
            - tools/migrate-sqlite-to-pg.mjs
            - --sqlite
            - /legacy/data/taskboard.sqlite
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-db-owner
                  key: password
            - name: DATABASE_URL
              value: "postgres://taskboard:$(DB_PASSWORD)@taskboard-db-rw:5432/taskboard"
          volumeMounts:
            - name: legacy-data
              mountPath: /legacy/data
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: legacy-data
          persistentVolumeClaim:
            claimName: taskboard-data
