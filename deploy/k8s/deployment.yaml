apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
spec:
  replicas: __REPLICAS__
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: taskboard
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 47823
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-db-owner
                  key: password
            - name: DATABASE_URL
              value: "postgres://taskboard:$(DB_PASSWORD)@taskboard-db-rw:5432/taskboard"
            - name: CODEX_TASKBOARD_TRUSTED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: taskboard-config
                  key: trustedHosts
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            # Writable scratch only (client-storage/jira config paths); the authoritative
            # store is PostgreSQL, so nothing here needs to survive pod replacement.
            - name: scratch
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: scratch
          emptyDir: {}
